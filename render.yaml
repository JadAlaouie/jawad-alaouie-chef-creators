services:
  - type: web
    name: chefcreators-web
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: chefcreators-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chefcreators-db
          property: connectionString
      - key: ADMIN_PIN
        value: kafta
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: chefcreators-db
    databaseName: chefcreators
    user: chefcreators
